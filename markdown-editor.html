<main id="writing"><textarea id="source" name="markdown" aria-label="Markdown source" placeholder="Start writing…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div id="enhanced" hidden></div></main>

<script>
'use strict';
(() => {
/*
Public API — available before any CDN request completes:
  getContent(): exact Markdown string (including supplied line endings).
  setContent(string): one undoable programmatic change; identical content is a no-op.
  focus(): focus the active editor. save(): {ok,savedAt?,error?}, synchronous.
  export('md'|'html'|'pdf'): Promise<{format,ok,filename?,outcome?,error?}>.
    Outcomes: download-started / print-opened; neither confirms a file was saved.
    Runtime failures resolve {ok:false}; invalid formats reject with TypeError.
    PDF prints the rendered document through an invisible frame in this tab.
  on('change'|'save'|'export'|'error', callback): idempotent unsubscribe function.
    change: {content,origin:'user'|'programmatic'} (undo/redo are user changes).
    save/export: the result above. error: {operation,message,cause?,recoverable}.
    Invalid setContent/on arguments throw TypeError. Subscribers are isolated.

Storage: raw text at quiet.markdown.v1, scoped to this browser and origin/file.
No startup write. A failed read is never interpreted as a successfully saved note.
If editing starts before enhancement, keep the textarea for this session to retain
its coherent history. Reload after saving to retry enhancement. No Tab binding.

Dependencies: exact import-map pins above; fonts in #font-styles. Native ESM
imports share one state module; highlight.js uses pinned esm.sh translations.
Renderer/highlighter/sanitizer load only for HTML/PDF. CDN access is needed for
uncached dependencies/fonts, and authored images may also need the network.
Palette: https://catppuccin.com/palette/ (Latte / Mocha).

Verification (2026-09-08): Chromium 151 and Firefox 153 automation covered
file:// and HTTP, enhanced/fallback editing, exact source/undo, storage, menus,
responsive themes, sanitized exports and filenames. Chromium also covered
dependency failures/retries, print resource recovery and 13-page pagination.
Desktop/mobile dark-theme screenshots were inspected in Paseo. Native print
dialogs, OS shortcuts, real IME, screen readers and browser zoom still need
manual checks. WebKit could not launch here (missing libicudata.so.74);
Safari support has not been verified. No tests or build tools are required to run.
*/
const $ = id => document.getElementById(id);
const normalize = text => text.replace(/\r\n?/g,'\n');
const listeners = new Map(['change','save','export','error'].map(name=>[name,new Set()]));
function emit(name,payload) {
  for (const callback of [...listeners.get(name)]) {
    try { callback(payload); } catch { console.warn('A markdownEditor subscriber threw an exception.'); }
  }
}
function report(operation,message,cause) { emit('error',{operation,message,cause,recoverable:true}); }
function notice(key,message,actions=[]) {
  $(key)?.remove();
  const box=document.createElement('div'); box.id=key; box.className='message';
  const dismiss=document.createElement('button'); dismiss.className='dismiss'; dismiss.textContent='×'; dismiss.setAttribute('aria-label','Dismiss notification'); dismiss.onclick=()=>box.remove();
  const text=document.createElement('p'); text.textContent=message; text.setAttribute('role','status');
  box.append(dismiss,text);
  for(const [label,run] of actions) { const button=document.createElement('button'); button.className='action'; button.textContent=label; button.onclick=run; box.append(button); }
  $('messages').append(box);
}
function status(state,label) {
  const indicator=$('save-indicator');
  indicator.dataset.state=state; indicator.setAttribute('aria-label',label); indicator.title=label;
  if($('save-status').textContent!==label) $('save-status').textContent=label;
}
function bounded(promise,ms,label) {
  let timer;
  return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' timed out.')),ms);})]).finally(()=>clearTimeout(timer));
}
const dependencies=JSON.parse($('dependency-manifest').textContent).imports;
const requests=new Map(), attempts=new Map();
function load(name) {
  if(requests.has(name)) return requests.get(name);
  const attempt=attempts.get(name)||0;
  const url=dependencies[name];
  if(!url) return Promise.reject(new Error('Unknown dependency: '+name));
  // Cache-bust failed top-level imports: browsers cache failed module evaluations.
  const request=bounded(import(url+(attempt?(url.includes('?')?'&':'?')+'retry='+attempt:'')),15000,name)
    .catch(error=>{requests.delete(name);attempts.set(name,attempt+1);throw error;});
  requests.set(name,request); return request;
}
// Translate normalized editor offsets back into the exact raw string. Existing
// CRLF/CR breaks survive edits; freshly typed line breaks use LF.
function rawOffset(raw,offset) {
  let i=0,n=0; for(;i<raw.length&&n<offset;i++,n++) if(raw[i]==='\r'&&raw[i+1]==='\n') i++;
  return i;
}
function spliceRaw(raw,from,to,insert) { return raw.slice(0,rawOffset(raw,from))+insert+raw.slice(rawOffset(raw,to)); }
function reconcile(raw,next) {
  const old=normalize(raw); let start=0,end=0;
  while(start<old.length&&start<next.length&&old[start]===next[start]) start++;
  while(end<old.length-start&&end<next.length-start&&old[old.length-1-end]===next[next.length-1-end]) end++;
  return spliceRaw(raw,start,old.length-end,next.slice(start,next.length-end));
}

// Persistence controller. Revision numbers prevent duplicate lifecycle writes.
const storageKey='quiet.markdown.v1';
let revision=0,savedRevision=0,dirty=false,saveTimer=null,savedAt,readError=null,restored='';
try { const value=localStorage.getItem(storageKey); restored=value===null?'':value; }
catch(error) { readError=error; }
function storageFailure(error,reading=false) {
  const message=reading?'Local storage could not be read. Existing saved text has not been overwritten. You can keep writing and download Markdown.':'Could not save locally. Your text is still here. Retry or download Markdown.';
  status('error',reading?'Local storage could not be read':'Local save failed');
  notice('storage-error',message,[['Retry',()=>{if(readError&&!dirty) retryRead(); else save();}],['Download Markdown',()=>exportDocument('md')]]);
  report(reading?'storage-read':'save',message,error);
}
function retryRead() {
  try {
    const value=localStorage.getItem(storageKey); readError=null;
    if(value!==null) adapter.restore(value);
    $('storage-error')?.remove(); status('idle','Restored locally; no new write yet');
  } catch(error) { storageFailure(error,true); }
}
function changed(origin) {
  revision++; dirty=true; clearTimeout(saveTimer); status('pending','Changes pending');
  saveTimer=setTimeout(save,300); emit('change',{content:adapter.getContent(),origin});
}
function save() {
  clearTimeout(saveTimer); saveTimer=null;
  if(!dirty&&savedRevision===revision&&savedAt) return {ok:true,savedAt};
  try {
    localStorage.setItem(storageKey,adapter.getContent());
    dirty=false; readError=null; savedRevision=revision; savedAt=new Date().toISOString();
    status('saved','Saved locally'); $('storage-error')?.remove();
    const result={ok:true,savedAt}; emit('save',result); return result;
  } catch(error) {
    dirty=true; storageFailure(error);
    const result={ok:false,error:error.message||'Local storage is unavailable.'}; emit('save',result); return result;
  }
}
function flush() { if(dirty) save(); }
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') flush();});
window.addEventListener('pagehide',flush); window.addEventListener('beforeunload',flush);

// Editor adapters: textarea owns its entire history, including composition and
// browser beforeinput history actions. No mixture with native undo stacks.
function textareaAdapter(initial) {
  const input=$('source'); let raw=initial,undo=[],redo=[],before=null,composition=null,lastInput=null;
  input.value=normalize(raw);
  const selection=()=>({from:input.selectionStart,to:input.selectionEnd,direction:input.selectionDirection});

  }
  for(const node of fragment.querySelectorAll('[class]')) {
    node.className=node.className.split(/\s+/).filter(name=>/^hljs-[\w-]+$/.test(name)||name==='short-code').join(' ');
  }
  for(const node of fragment.querySelectorAll('[href],[src]')) {
    for(const attr of ['href','src']) if(node.hasAttribute(attr)) {
      const raw=node.getAttribute(attr);
      if(attr==='href'&&raw.startsWith('#'))continue;
      try {
        const url=new URL(raw,document.baseURI);
        const allowed=attr==='href'?['http:','https:','mailto:','tel:']:['http:','https:'];
        if(location.protocol==='file:')allowed.push('file:');
        if(attr==='src'&&/^data:image\/(?:png|jpeg|gif|webp);base64,/i.test(raw))continue;
        if(!allowed.includes(url.protocol))node.removeAttribute(attr);else node.setAttribute(attr,url.href);
      } catch {node.removeAttribute(attr);}
    }
  }
  const container=document.createElement('div');container.append(fragment);
  const policy="default-src 'none'; img-src https: http: file: data:; font-src https://cdn.jsdelivr.net; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'";
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<meta http-equiv="Content-Security-Policy" content="'+escapeHTML(policy)+'"><title>'+escapeHTML(stem)+'</title><style>'+$('font-styles').textContent+'\n'+documentCSS+'</style></head><body>'+container.innerHTML+'</body></html>';
}

// Export controller: all work uses the source captured before the first await.
function download(source,filename,type) {
  const blob=new Blob([source],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob);
  try {
    const link=document.createElement('a');link.href=url;link.download=filename;link.hidden=true;
    document.body.append(link);link.click();link.remove();
  } finally {setTimeout(()=>URL.revokeObjectURL(url),60000);}
}
function finishExport(result) {
  if(result.ok&&result.format!=='md')$('export-error')?.remove();
  emit('export',result);return result;
}
function printNow(printFrame,filename) {
  if(!printFrame.isConnected)throw new Error('The print document was removed. Retry PDF export.');
  const printWindow=printFrame.contentWindow;
  // afterprint means the dialog finished (including cancellation), not PDF saved.
  printWindow.addEventListener('afterprint',()=>setTimeout(()=>printFrame.remove(),250),{once:true});
  printWindow.focus();printWindow.print();
  return {format:'pdf',ok:true,filename,outcome:'print-opened'};
}
async function preparePrint(printFrame,html) {
  if(!printFrame.isConnected)throw new Error('The print document was removed. Retry PDF export.');
  const printWindow=printFrame.contentWindow;
  const loaded=new Promise((resolve,reject)=>{
    try {
      // document.open() clears window listeners: subscribe only after opening.
      printWindow.document.open();
      printWindow.addEventListener('load',resolve,{once:true});
      printWindow.document.write(html);printWindow.document.close();
    }
    catch(error){reject(error);}
  });
  if(!printFrame.isConnected)throw new Error('The print document was removed. Retry PDF export.');
  const doc=printWindow.document;
  // Font CSS is inline in the shared document: it is ready at document load.
  const resources=[bounded(loaded,12000,'Print document loading'),...[...doc.images].map((img,index)=>bounded((async()=>{
    if(!img.complete)await new Promise((resolve,reject)=>{
      img.addEventListener('load',resolve,{once:true});img.addEventListener('error',()=>reject(new Error('Image '+(index+1)+' failed to load.')),{once:true});
    });
    if(!img.naturalWidth)throw new Error('Image '+(index+1)+' is unavailable.');
    if(img.decode)await img.decode();
  })(),12000,'Image '+(index+1)))];
  if(doc.fonts)resources.push(bounded((async()=>{
    await Promise.all(['400 16px Inter','700 16px Inter','400 16px Hack','700 16px Hack','italic 400 16px Hack','italic 700 16px Hack'].map(font=>doc.fonts.load(font)));
    await doc.fonts.ready;
  })(),12000,'Fonts'));
  const results=await Promise.allSettled(resources);
  if(!printFrame.isConnected)throw new Error('The print document was removed. Retry PDF export.');
  const failures=results.filter(result=>result.status==='rejected');
  if(failures.length) {
    const error=new Error('Some print resources could not load ('+failures.length+'). Remote or relative images may be unavailable; fonts may need a network connection.');
    error.resources=true;throw error;
  }
}
let renderBusy=0;
async function exportSnapshot(format,source) {
  const stem=filenameStem(source),filename=stem+'.'+format;
  let printFrame=null;
  if(format!=='md') {renderBusy++;$('export-button').setAttribute('aria-busy','true');}
  try {
    if(format==='md') {
      download(source,filename,'text/markdown');
      return finishExport({format,ok:true,filename,outcome:'download-started'});
    }
    const html=await buildDocument(source,stem);
    if(format==='html') {
      download(html,filename,'text/html');
      return finishExport({format,ok:true,filename,outcome:'download-started'});
    }
    printFrame=document.createElement('iframe');
    printFrame.title='Print document';printFrame.setAttribute('aria-hidden','true');printFrame.tabIndex=-1;
    // Keep a rendered browsing context for printing without adding a tab.
    printFrame.style.cssText='position:fixed;left:-10000px;top:0;width:800px;height:600px;border:0;pointer-events:none';
    document.body.append(printFrame);
    await preparePrint(printFrame,html);
    return finishExport(printNow(printFrame,filename));
  } catch(error) {
    const message=error.message||'Export failed. Please retry.';
    report('export',message,error);
    const actions=[['Retry '+format.toUpperCase(),()=>{printFrame?.remove();exportSnapshot(format,source);}]];
    if(error.resources&&printFrame?.isConnected) actions.push(['Print available resources',()=>{
      try {finishExport(printNow(printFrame,filename));$('export-error')?.remove();}
      catch(cause) {printFrame?.remove();report('export',cause.message,cause);notice('export-error',cause.message,[['Retry PDF',()=>exportSnapshot('pdf',source)]]);finishExport({format,ok:false,error:cause.message});}
    }]);
    else printFrame?.remove();
    actions.push(['Download Markdown',()=>exportSnapshot('md',source)]);
    notice('export-error',message,actions);
    return finishExport({format,ok:false,error:message});
  } finally {
    if(format!=='md'&&--renderBusy===0)$('export-button').removeAttribute('aria-busy');
  }
}
async function exportDocument(format) {
  if(!['md','html','pdf'].includes(format))throw new TypeError('Export format must be md, html, or pdf.');
  return exportSnapshot(format,adapter.getContent());
}

// Application shell: a conventional keyboard-accessible menu; Tab is never trapped.
const exportButton=$('export-button'),menu=$('export-menu'),menuItems=[...menu.querySelectorAll('button')];
function focusItem(index) {menuItems.forEach((item,i)=>item.tabIndex=i===index?0:-1);menuItems[index].focus();}
function openMenu(index=0) {menu.hidden=false;exportButton.setAttribute('aria-expanded','true');focusItem(index);}
function closeMenu(returnFocus=false) {menu.hidden=true;exportButton.setAttribute('aria-expanded','false');menuItems.forEach(item=>item.tabIndex=-1);if(returnFocus)exportButton.focus();}
exportButton.addEventListener('click',()=>menu.hidden?openMenu():closeMenu(true));
exportButton.addEventListener('keydown',event=>{
  if(event.key==='ArrowDown'||event.key==='ArrowUp') {event.preventDefault();openMenu(event.key==='ArrowUp'?menuItems.length-1:0);}
  if(event.key==='Escape'&&!menu.hidden) {event.preventDefault();closeMenu(true);}
});
menu.addEventListener('keydown',event=>{
  const index=menuItems.indexOf(document.activeElement);
  const destinations={ArrowDown:(index+1)%menuItems.length,ArrowUp:(index-1+menuItems.length)%menuItems.length,Home:0,End:menuItems.length-1};
  if(event.key in destinations){event.preventDefault();focusItem(destinations[event.key]);}
  else if(event.key==='Escape'){event.preventDefault();closeMenu(true);}
  else if(event.key==='Tab')setTimeout(()=>closeMenu(),0);
});
menuItems.forEach(item=>item.addEventListener('click',()=>{closeMenu(true);exportDocument(item.dataset.format);}));
document.addEventListener('keydown',event=>{
  if(event.isComposing||event.altKey||event.shiftKey||(mac?!event.metaKey:!event.ctrlKey)||event.key.toLowerCase()!=='p')return;
  event.preventDefault();event.stopPropagation();
  if(event.repeat)return;
  closeMenu(true);exportDocument('pdf');
},{capture:true});
document.addEventListener('pointerdown',event=>{if(!menu.hidden&&!$('controls').contains(event.target))closeMenu();});
document.addEventListener('focusin',event=>{if(!menu.hidden&&!$('controls').contains(event.target))closeMenu();});
adapter.focus();
enhance();
})();
</script>
